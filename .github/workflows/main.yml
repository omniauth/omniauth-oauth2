name: Ruby

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ruby: [2.5, 2.6, 2.7, '3.0', 3.1, 3.2, 3.3, 3.4, '4.0', head, debug, truffleruby, truffleruby-head, jruby, jruby-head]
        # setup-ruby has no Ruby 2.5 build for Apple silicon.
        exclude:
        - os: macos-latest
          ruby: 2.5
    steps:
    - uses: actions/checkout@v7
    - id: ruby
      name: Set up Ruby
      continue-on-error: ${{ endsWith(matrix.ruby, 'head') || matrix.ruby == 'debug' }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - id: set-jruby-opts
      name: Set JRUBY_OPTS environment variable
      continue-on-error: ${{ endsWith(matrix.ruby, 'head') || matrix.ruby == 'debug' }}
      run: echo "JRUBY_OPTS=--debug" >> "$GITHUB_ENV"
      if: ${{ startsWith(matrix.ruby, 'jruby') }}
    - id: tests
      name: Run tests
      continue-on-error: ${{ endsWith(matrix.ruby, 'head') || matrix.ruby == 'debug' }}
      run: bundle exec rake spec rubocop steep
    - id: upload-artifact
      uses: actions/upload-artifact@v7
      continue-on-error: ${{ endsWith(matrix.ruby, 'head') || matrix.ruby == 'debug' }}
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.ruby == '4.0' }}
      with:
        name: coverage
        path: coverage/
        retention-days: 1
    - name: Note an advisory failure
      if: steps.ruby.outcome == 'failure' || steps.set-jruby-opts.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.upload-artifact.outcome == 'failure'
      run: echo "::warning title=Advisory failure::A step failed, but this job is allowed to fail, so the build still passes"

  mutant:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '4.0'
        bundler-cache: true
    - name: Run mutation tests
      run: bundle exec rake mutant

  coveralls:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: coverage
        path: coverage/
    - name: Coveralls GitHub Action
      uses: coverallsapp/github-action@v2
